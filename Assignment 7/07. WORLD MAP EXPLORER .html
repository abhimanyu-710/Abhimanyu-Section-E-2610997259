
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>

</head>

<body>

    <h1>🌍 World Map Explorer</h1>

    <p>Click on the map to explore different countries!</p>

    <div class="info">
        <h2>Explore the World</h2>
        <p>
            Discover countries and learn about their culture,
            history and geography.
        </p>
    </div>

    <img
        src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
        alt="World map with clickable country regions"
        usemap="#worldmap"
    >

    <map name="worldmap">

        <area
            shape="circle"
            coords="650,260,35"
            href="https://en.wikipedia.org/wiki/India"
            alt="Explore India"
            target="_blank"
            title="India"
        >

        <area
            shape="rect"
            coords="730,340,850,430"
            href="https://en.wikipedia.org/wiki/Australia"
            alt="Explore Australia"
            target="_blank"
            title="Australia"
        >

        <area
            shape="poly"
            coords="120,110,260,100,310,150,260,205,170,195,130,160"
            href="https://en.wikipedia.org/wiki/United_States"
            alt="Explore United States"
            target="_blank"
            title="United States"
        >

        <area
            shape="default"
            href="https://www.worldatlas.com/"
            alt="Explore more places around the world"
            target="_blank"
            title="Explore more places"
        >

    </map>

    <div class="info">
        <h3>What will you learn?</h3>
        <p>Circle • Rectangle • Polygon • Default</p>
        <p>HTML Image Maps and Hyperlinks</p>
    </div>

</body>
</html>

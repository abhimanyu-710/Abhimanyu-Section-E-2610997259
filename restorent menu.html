<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
   
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Today's Special Menu</caption>
        <thead>
            <tr>
                <th>Category</th>
                <th>Food Item</th>
                <th class="center-align">Price (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr class="starters-row">
                <td rowspan="3" class="center-align"><b>Starters</b></td>
                <td>Spring Rolls</td>
                <td class="right-align">120</td>
            </tr>
            <tr class="starters-row">
                <td>Garlic Bread</td>
                <td class="right-align">100</td>
            </tr>
            <tr class="starters-row">
                <td>Veg Soup</td>
                <td class="right-align">80</td>
            </tr>

            <tr class="main-row">
                <td rowspan="3" class="center-align"><b>Main Course</b></td>
                <td>Paneer Butter Masala</td>
                <td class="right-align">180</td>
            </tr>
            <tr class="main-row">
                <td>Veg Biryani</td>
                <td class="right-align">150</td>
            </tr>
            <tr class="main-row">
                <td>Dal Tadka</td>
                <td class="right-align">120</td>
            </tr>

            <tr class="desserts-row">
                <td rowspan="3" class="center-align"><b>Desserts</b></td>
                <td>Chocolate Cake</td>
                <td class="right-align">90</td>
            </tr>
            <tr class="desserts-row">
                <td>Ice Cream</td>
                <td class="right-align">70</td>
            </tr>
            <tr class="desserts-row">
                <td>Gulab Jamun</td>
                <td class="right-align">60</td>
            </tr>

            <tr class="drinks-row">
                <td rowspan="3" class="center-align"><b>Drinks</b></td>
                <td>Fresh Lime Soda</td>
                <td class="right-align">50</td>
            </tr>
            <tr class="drinks-row">
                <td>Cold Coffee</td>
                <td class="right-align">80</td>
            </tr>
            <tr class="drinks-row">
                <td>Mango Shake</td>
                <td class="right-align">70</td>
            </tr>
        </tbody>
    </table>

</body>
</html>

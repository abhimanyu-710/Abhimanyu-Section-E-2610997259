<form>
  <label for="fullName">Full Name:</label>
  <input type="text" id="fullName" name="fullName"><br><br>

  <label for="age">Age:</label>
  <input type="number" id="age" name="age"><br><br>

  <label>Gender:</label><br>
  <input type="radio" id="male" name="gender" value="Male">
  <label for="male">Male</label>

  <input type="radio" id="female" name="gender" value="Female">
  <label for="female">Female</label>

  <input type="radio" id="other" name="gender" value="Other">
  <label for="other">Other</label><br><br>

  <label>Course:</label><br>
  <input type="radio" id="bca" name="course" value="BCA">
  <label for="bca">BCA</label>

  <input type="radio" id="bsc" name="course" value="B.Sc.">
  <label for="bsc">B.Sc.</label>

  <input type="radio" id="btech" name="course" value="B.Tech.">
  <label for="btech">B.Tech.</label><br><br>

  <label>Skills:</label><br>
  <input type="checkbox" id="html" name="skills" value="HTML">
  <label for="html">HTML</label>

  <input type="checkbox" id="css" name="skills" value="CSS">
  <label for="css">CSS</label>

  <input type="checkbox" id="javascript" name="skills" value="JavaScript">
  <label for="javascript">JavaScript</label>

  <input type="checkbox" id="python" name="skills" value="Python">
  <label for="python">Python</label><br><br>

  <!-- Submit Button -->
  <input type="submit" value="Submit">
</form>
